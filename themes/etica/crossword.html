<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crucigrama – Ética y moral</title>
<style>
  :root{
    --bg:#0e1426; --panel:#111a31; --ink:#eaf0ff; --muted:#9aa6d1;
    --accent:#6b7cff; --accent2:#b074ff; --ok:#10b981; --err:#ef4444;
    --cell:#0f1730; --cell-border:#223059;
  }
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,Segoe UI,Roboto,Arial}
  .wrap{max-width:920px;margin:0 auto;padding:18px}
  h1{font-size:22px;margin:4px 0 14px}
  .board{
    display:grid; gap:6px; padding:14px;
    background:linear-gradient(135deg, rgba(107,124,255,.12), rgba(176,116,255,.08));
    border:1px solid var(--cell-border); border-radius:14px;
    box-shadow:0 10px 30px -18px rgba(0,0,0,.6);
    touch-action:manipulation;
  }
  .cell{
    width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px dashed transparent; color:#fff; font-weight:600;
    user-select:none;
  }
  .cell.placeholder{ background:var(--cell); border-color:var(--cell-border); }
  .cell.central{ background:linear-gradient(180deg, rgba(107,124,255,.28), rgba(176,116,255,.16)); border-color:#7284ff62 }
  .cell.filled{ background:linear-gradient(180deg, rgba(16,185,129,.25), rgba(16,185,129,.12)); border-color:#10b98175; }
  .cell.tap{ outline:2px solid var(--accent); }
  .hud{
    display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 6px;
  }
  .pill{
    background:var(--panel); border:1px solid var(--cell-border);
    padding:8px 12px; border-radius:999px; color:var(--muted); font-size:14px;
  }
  .pill b{ color:#fff }
  /* bottom-sheet */
  .sheet{ position:fixed; left:0; right:0; bottom:-70%; background:var(--panel);
    border-top-left-radius:14px; border-top-right-radius:14px; border:1px solid var(--cell-border);
    box-shadow:0 -10px 30px rgba(0,0,0,.4); padding:14px 16px; transition:transform .35s ease, bottom .35s ease;
  }
  .sheet.open{ bottom:0; }
  .sheet h3{ margin:0 0 8px; font-size:16px }
  .q{ color:#cfd8ff; margin:8px 0 12px }
  .ansrow{ display:flex; gap:8px; }
  .ansrow input{
    flex:1; font-size:18px; padding:10px 12px; border-radius:10px;
    background:#0b1226; border:1px solid var(--cell-border); color:#fff;
  }
  .btn{
    background:linear-gradient(90deg, var(--accent), var(--accent2)); color:#fff; border:none;
    padding:10px 12px; border-radius:10px; font-weight:600; cursor:pointer;
  }
  .btn.flat{ background:#1f2937; }
  .toast{ position:fixed; top:12px; left:50%; transform:translateX(-50%);
    background:#1f2937; color:#fff; padding:8px 12px; border-radius:10px; border:1px solid var(--cell-border);
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; }
  @media (min-width:480px){ .cell{ width:36px; height:36px } }
</style>
</head>
<body>
  <main class="wrap">
    <h1>🧩 Crucigrama · Ética y moral</h1>

    <div class="hud">
      <div class="pill">Progreso: <b id="progress">0/0</b></div>
      <div class="pill">Puntaje: <b id="score">0</b></div>
      <div class="pill">Intentos: <b id="tries">0</b></div>
      <div class="pill">Sonido: <button id="mute" class="btn flat" style="padding:6px 10px">🔊</button></div>
    </div>

    <div id="board" class="board" aria-label="Tablero del crucigrama"></div>
  </main>

  <!-- hoja inferior -->
  <section id="sheet" class="sheet" aria-live="polite">
    <h3 id="sheet-title">Pregunta</h3>
    <p id="question" class="q"></p>
    <div class="ansrow">
      <input id="answer" autocomplete="off" placeholder="Escribe tu respuesta…" />
      <button id="check" class="btn">Comprobar</button>
      <button id="close" class="btn flat">Cerrar</button>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <!-- Config y motor -->
  <script src="crossword_config.js"></script>
  <script src="../../js/crossword-engine.js"></script>
</body>
</html>
