<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Crucigrama</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <link rel="stylesheet" href="css/educational-modal.css">
  <style>
    :root{
      --bg:#0b1220; --panel:#0f172a; --ink:#eaf0ff; --muted:#9fb0ff;
      --line:#223059; --brand:#7c3aed; --brand2:#6b7cff; --ok:#10b981; --bad:#ef4444;
      --cell:#0c1426; --cell2:#0e162d; --central:#162244;
      --radius:14px; --warning:#f59e0b; --input-bg:#0e1829;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(1200px 500px at 70% -120px, rgba(107,124,255,.18), transparent 60%),var(--bg);color:var(--ink);font:16px/1.5 Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:18px}

    /* Header mejorado */
    header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;gap:14px}
    .title-section{display:flex;align-items:center;gap:12px}
    h1{margin:0;font-size:22px}
    .tag{display:inline-grid;place-items:center;padding:8px 12px;border-radius:12px;background:#0e162c;border:1px solid var(--line);color:#cfe2ff}
    .header-actions{display:flex;align-items:center;gap:10px}
    
    .btn-back{
      display:flex;align-items:center;gap:8px;
      background:#142038;border:1px solid var(--line);color:#cfe2ff;
      padding:10px 16px;border-radius:10px;text-decoration:none;
      font-weight:600;transition:all 0.2s;cursor:pointer;
    }
    .btn-back:hover{background:#1a2544;border-color:#3b4a73;transform:translateY(-1px)}

    /* Indicador Firebase */
    .firebase-status {
      position: fixed; top: 10px; right: 10px; padding: 4px 8px; border-radius: 6px;
      font-size: 0.8rem; font-weight: 600; z-index: 1000; opacity: 0.8; transition: all 0.3s ease;
    }
    .firebase-status.connected { background: #10b981; color: white; }
    .firebase-status.disconnected { background: #ef4444; color: white; }
    .firebase-status.saving { background: #f59e0b; color: white; animation: pulse 1s infinite; }
    .firebase-status:hover { opacity: 1; transform: scale(1.05); }

    .hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .pill{background:#0f182e;border:1px solid var(--line);padding:10px 12px;border-radius:999px;color:#cfe2ff}
    .switch{display:inline-flex;align-items:center;gap:8px}
    .switch button{background:#1a2445;border:1px solid var(--line);color:#cfe2ff;padding:8px 10px;border-radius:10px;cursor:pointer;transition:all 0.2s}
    .switch button:hover{background:#233052;border-color:#3b4a73}

    .board{background:linear-gradient(180deg,#0f1629,#0a1020);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
    #grid{display:grid;gap:4px;place-content:center;margin-bottom:14px}

    .cell{
      display:grid;place-items:center;border:1px solid #1f2a4a;
      background:var(--cell);border-radius:8px;font-weight:800;font-size:18px;
      color:#cfe2ff;user-select:none;transition:all 0.2s ease;
      position:relative;
    }
    .cell.h{background:var(--cell2);cursor:pointer}
    .cell.h:hover{background:#152033;border-color:#2a3763}
    .cell.central{background:var(--central);color:#bcd1ff}
    .cell.empty{visibility:hidden;border:none}

    .cell.sel{
      outline:2px solid var(--brand);
      box-shadow:0 0 0 2px rgba(124,58,237,.25) inset;
      transform:scale(1.02);
    }
    
    .done .cell.h[data-word-solved="1"]{
      background:linear-gradient(180deg,#0f1c2f,#0f2036);
      border-color:#305;
      box-shadow:inset 0 0 0 1px rgba(124,58,237,.18);
    }

    /* Input mejorado */
    .input-section{
      background:#0e162b;border:1px solid var(--line);border-radius:12px;
      padding:16px;display:none;animation:slideIn 0.3s ease;
    }
    .input-section.show{display:block}
    
    .question{color:#cfe2ff;font-size:16px;margin-bottom:8px;line-height:1.4}
    .word-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .length-info{color:#9fb0ff;font-size:14px}
    .difficulty{
      background:rgba(107,124,255,.15);color:#9fb0ff;
      padding:4px 8px;border-radius:6px;font-size:12px;
    }

    /* Campo de entrada visual */
    .visual-input{
      display:flex;gap:4px;margin-bottom:16px;justify-content:center;
      flex-wrap:wrap;
    }
    .letter-slot{
      width:40px;height:40px;
      border:2px solid #223059;background:var(--input-bg);
      border-radius:8px;display:grid;place-items:center;
      font-size:18px;font-weight:800;color:#eaf0ff;
      transition:all 0.2s;position:relative;
    }
    .letter-slot.filled{border-color:var(--brand);background:#1a2445}
    .letter-slot.active{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.2)}
    .letter-slot.correct{border-color:var(--ok);background:rgba(16,185,129,.1)}
    .letter-slot.incorrect{border-color:var(--bad);background:rgba(239,68,68,.1)}

    /* Campo oculto para input real */
    #textInput{
      position:absolute;opacity:0;pointer-events:none;
    }

    /* Validación en tiempo real */
    .validation{
      display:flex;align-items:center;gap:8px;margin-bottom:12px;
      padding:8px 12px;border-radius:8px;font-size:14px;
    }
    .validation.valid{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--ok)}
    .validation.invalid{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--bad)}
    .validation.incomplete{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--warning)}

    .actions{display:flex;gap:10px;justify-content:center}
    .btn{
      appearance:none;border:0;border-radius:10px;padding:12px 20px;
      font-weight:700;cursor:pointer;transition:all 0.2s;
      font-size:14px;min-width:120px;
    }
    .btn-primary{
      background:linear-gradient(90deg,var(--brand),var(--brand2));
      color:#fff;
    }
    .btn-primary:hover:not(:disabled){
      transform:translateY(-1px);
      box-shadow:0 4px 12px rgba(124,58,237,.3);
    }
    .btn-primary:disabled{
      opacity:0.5;cursor:not-allowed;
    }

    /* Modal de completado */
    .completion-modal{
      position:fixed;inset:0;background:rgba(0,0,0,.8);
      display:none;align-items:center;justify-content:center;
      z-index:1000;backdrop-filter:blur(4px);
    }
    .completion-modal.show{display:flex}
    .modal-content{
      background:linear-gradient(180deg,#0f1629,#0a1020);
      border:1px solid var(--line);border-radius:18px;
      padding:32px;text-align:center;max-width:400px;
      animation:modalIn 0.5s ease;
    }
    .modal-icon{font-size:48px;margin-bottom:16px}
    .modal-title{font-size:24px;font-weight:800;margin-bottom:8px;color:#eaf0ff}
    .modal-stats{
      background:#0e162b;border-radius:12px;padding:16px;margin:16px 0;
      display:grid;grid-template-columns:1fr 1fr;gap:16px;
    }
    .stat{text-align:center}
    .stat-value{font-size:20px;font-weight:800;color:var(--brand)}
    .stat-label{font-size:12px;color:var(--muted)}

    /* Animaciones */
    @keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes modalIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
    
    .pulse{animation:pulse 0.6s ease-in-out}
    .shake{animation:shake 0.3s ease-in-out}

    /* Responsive */
    @media (max-width:640px){
      .cell{font-size:16px}
      .wrap{padding:12px}
      .hud{gap:8px}
      .pill{padding:8px 10px;font-size:14px}
      .header-actions{justify-content:flex-end}
      .visual-input{gap:2px}
      .letter-slot{width:32px;height:32px;font-size:16px}
      .modal-content{margin:20px;padding:24px}
      .firebase-status{top:5px;right:5px;font-size:0.7rem;padding:3px 6px}
    }
  </style>
</head>
<body>
  <!-- Indicador de estado Firebase -->
  <div class="firebase-status disconnected" id="firebase-status">🔥 Cargando...</div>

  <div class="wrap">
    <header>
      <div class="title-section">
        <h1>🧩 <span id="title">Cargando...</span></h1>
        <span class="tag" id="temaChip" style="display: none;">—</span>
      </div>
      <div class="header-actions">
        <a href="#" class="btn-back" id="backBtn">
          <!-- <span>←</span> -->
          <span>Actividades</span>
        </a>
      </div>
    </header>

    <div class="hud">
      <div class="pill">Progreso: <b id="prog">0/0</b></div>
      <div class="pill">Puntaje: <b id="score">0</b></div>
      <div class="pill">Intentos: <b id="tries">0</b></div>
      <div class="pill switch">
        Sonido: <button id="muteBtn">🔊</button>
      </div>
    </div>

    <section class="board">
      <div id="grid" aria-label="Tablero del crucigrama"></div>

      <div class="input-section" id="inputSection">
        <div class="question" id="questionText">Selecciona una palabra para empezar...</div>
        
        <div class="word-info">
          <div class="length-info" id="lengthInfo"></div>
          <div class="difficulty" id="difficultyTag"></div>
        </div>
        
        <div class="visual-input" id="visualInput"></div>
        
        <input type="text" id="textInput" autocomplete="off" maxlength="20">
        
        <div class="validation" id="validation" style="display:none">
          <span id="validationIcon">ℹ️</span>
          <span id="validationText">Escribe tu respuesta...</span>
        </div>
        
        <div class="actions">
          <button class="btn btn-primary" id="verifyBtn" disabled>
            Verificar respuesta
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- Modal de completado -->
  <div class="completion-modal" id="completionModal">
    <div class="modal-content">
      <div class="modal-icon">🏆</div>
      <div class="modal-title">¡Crucigrama completado!</div>
      <div class="modal-stats">
        <div class="stat">
          <div class="stat-value" id="finalScore">0</div>
          <div class="stat-label">PUNTOS</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="finalAccuracy">0%</div>
          <div class="stat-label">PRECISIÓN</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="backToThemeBtn">
          Salir
        </button>
      </div>
    </div>
  </div>

  <!-- ====================================== -->
  <!-- 🔥 SCRIPTS CON FIREBASE (NUEVO ORDEN) -->
  <!-- ====================================== -->

  <!-- 1. Configuración básica -->
  <script>
    console.log('🧩 Iniciando crucigrama con Firebase...');
    
    // Obtener tema desde URL
    const params = new URLSearchParams(location.search);
    const tema = params.get('tema') || params.get('theme') || 'etica_aristoteles';
    
    console.log('🎯 Tema detectado:', tema);
    
    // Marcar tiempo de inicio
    window.crosswordStartTime = Date.now();
    
    // Firebase Status Indicator
    function updateFirebaseStatus(status) {
      const indicator = document.getElementById('firebase-status');
      if (!indicator) return;
      
      indicator.classList.remove('connected', 'disconnected', 'saving');
      
      switch (status) {
        case 'connected':
          indicator.classList.add('connected');
          indicator.textContent = '🔥 Conectado';
          break;
        case 'saving':
          indicator.classList.add('saving');
          indicator.textContent = '🔥 Guardando...';
          break;
        case 'disconnected':
        default:
          indicator.classList.add('disconnected');
          indicator.textContent = '🔥 Desconectado';
          break;
      }
    }
    window.updateFirebaseStatus = updateFirebaseStatus;
    
    // Configurar botones de navegación
    const backBtn = document.getElementById('backBtn');
    const backToThemeBtn = document.getElementById('backToThemeBtn');
    const backUrl = `tema.html?tema=${tema}&theme=${tema}`;
    
    backBtn.href = backUrl;
    backToThemeBtn.addEventListener('click', () => location.href = backUrl);
    
    // Actualizar UI inicial
    document.getElementById('temaChip').textContent = `Tema: ${tema}`;
    // document.getElementById('temaChip').style.display = 'inline-grid';
    document.getElementById('temaChip').style.display = 'none';
    document.getElementById('title').textContent = 'Cargando...';
  </script>

  <!-- 2. 🔥 SISTEMA DE PUNTUACIÓN FIREBASE (NUEVO) -->
  <script type="module" src="js/crossword-score.js"></script>

  <!-- 3. Motor del crucigrama original -->
  <script src="js/crossword_engine.js"></script>
  
  <!-- 4. Lógica principal mejorada -->
  <script>
// ========================================
// 🚀 INICIALIZACIÓN CORREGIDA DEL CRUCIGRAMA  
// Reemplazar el script problemático en crossword.html
// ========================================

console.log('🧩 Iniciando crucigrama con inicialización corregida...');

(async function initCrosswordCorregido() {
  const startTime = performance.now();
  
  // Obtener tema desde URL
  const params = new URLSearchParams(location.search);
  const tema = params.get('tema') || params.get('theme') || 'etica_aristoteles';
  
  console.log('🎯 Tema detectado:', tema);
  
  // Marcar tiempo de inicio
  window.crosswordStartTime = Date.now();
  
  // Actualizar UI inicial
  const temaChip = document.getElementById('temaChip');
  const titleEl = document.getElementById('title');
  
  if (temaChip) {
    temaChip.textContent = `Tema: ${tema}`;
    temaChip.style.display = 'inline-grid';
  }
  
  if (titleEl) {
    titleEl.textContent = 'Cargando crucigrama...';
  }
  
  // Configurar botones de navegación
  const backBtn = document.getElementById('backBtn');
  const backToThemeBtn = document.getElementById('backToThemeBtn');
  const backUrl = `tema.html?tema=${tema}&theme=${tema}`;
  
  if (backBtn) backBtn.href = backUrl;
  if (backToThemeBtn) {
    backToThemeBtn.addEventListener('click', () => location.href = backUrl);
  }
  
  // Función para esperar condición con timeout
  function waitFor(condition, timeout = 10000, interval = 100) {
    return new Promise((resolve, reject) => {
      const startTime = Date.now();
      
      const checkCondition = () => {
        if (condition()) {
          resolve(true);
        } else if (Date.now() - startTime > timeout) {
          reject(new Error(`Timeout después de ${timeout}ms`));
        } else {
          setTimeout(checkCondition, interval);
        }
      };
      
      checkCondition();
    });
  }
  
  // Función para cargar configuración (igual que la función manual que funciona)
  async function cargarConfiguracion() {
    console.log('📋 Cargando configuración del crucigrama...');
    
    if (window.CROSSWORD_CONFIG) {
      console.log('✅ Configuración ya disponible');
      return true;
    }
    
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `themes/${tema}/crossword_config.js`;
      
      script.onload = () => {
        console.log('✅ Script de configuración cargado');
        
        // Verificar que realmente se cargó la configuración
        if (window.CROSSWORD_CONFIG) {
          console.log('✅ CROSSWORD_CONFIG disponible:', window.CROSSWORD_CONFIG.title);
          resolve(true);
        } else {
          reject(new Error('CROSSWORD_CONFIG no se definió después de cargar el script'));
        }
      };
      
      script.onerror = (error) => {
        console.error('❌ Error cargando script de configuración:', error);
        reject(new Error(`Error cargando themes/${tema}/crossword_config.js`));
      };
      
      document.head.appendChild(script);
      
      // Timeout de seguridad
      setTimeout(() => {
        reject(new Error('Timeout cargando configuración (5s)'));
      }, 5000);
    });
  }
  
  // Función para esperar CrosswordEngine
  async function esperarCrosswordEngine() {
    console.log('🎮 Esperando CrosswordEngine...');
    
    try {
      await waitFor(() => {
        return typeof window.CrosswordEngine === 'object' && 
               window.CrosswordEngine !== null &&
               typeof window.CrosswordEngine.start === 'function';
      }, 15000);
      
      console.log('✅ CrosswordEngine disponible');
      return true;
    } catch (e) {
      throw new Error('CrosswordEngine no disponible después de 15 segundos');
    }
  }
  
  // Función para configurar Firebase (opcional pero recomendado)
  async function configurarFirebase() {
    console.log('🔥 Configurando Firebase...');
    
    try {
      // Esperar función de guardado
      await waitFor(() => typeof window.saveCrosswordProgress === 'function', 5000);
      console.log('✅ Firebase saveCrosswordProgress disponible');
      
      // Mejorar motor si está disponible
      if (typeof window.enhanceCrosswordEngine === 'function') {
        window.enhanceCrosswordEngine();
        console.log('✅ Motor mejorado con Firebase');
      }
      
      if (window.updateFirebaseStatus) {
        window.updateFirebaseStatus('connected');
      }
      
      return true;
    } catch (e) {
      console.warn('⚠️ Firebase no disponible, continuando sin integración:', e.message);
      
      if (window.updateFirebaseStatus) {
        window.updateFirebaseStatus('disconnected');
      }
      
      return false;
    }
  }
  
  // Función principal de inicialización (igual que la función manual)
  async function inicializarCrucigrama() {
    console.log('🚀 Inicializando crucigrama...');
    
    try {
      // Verificar dependencias críticas
      if (!window.CrosswordEngine) {
        throw new Error('CrosswordEngine no disponible');
      }
      
      if (!window.CROSSWORD_CONFIG) {
        throw new Error('CROSSWORD_CONFIG no disponible');
      }
      
      if (typeof window.CrosswordEngine.start !== 'function') {
        throw new Error('CrosswordEngine.start no es una función');
      }
      
      console.log('✅ Todas las dependencias verificadas');
      
      // Actualizar título
      if (titleEl) {
        titleEl.textContent = window.CROSSWORD_CONFIG.title || 'Crucigrama';
      }
      
      // Iniciar el motor (exactamente como en la función manual)
      window.CrosswordEngine.start(window.CROSSWORD_CONFIG, {
        tema: tema,
        useModernUI: true,
        withFirebase: true
      });
      
      const totalTime = performance.now() - startTime;
      console.log(`🎯 Crucigrama iniciado exitosamente en ${totalTime.toFixed(2)}ms`);
      
      return true;
      
    } catch (error) {
      console.error('❌ Error inicializando crucigrama:', error);
      mostrarError(error.message);
      return false;
    }
  }
  
  // Función para mostrar errores
  function mostrarError(mensaje) {
    console.error('❌ Error:', mensaje);
    
    if (titleEl) {
      titleEl.textContent = 'Error';
    }
    
    const questionText = document.getElementById('questionText');
    if (questionText) {
      questionText.textContent = `Error: ${mensaje}`;
    }
    
    const inputSection = document.getElementById('inputSection');
    if (inputSection) {
      inputSection.classList.add('show');
    }
    
    if (window.updateFirebaseStatus) {
      window.updateFirebaseStatus('disconnected');
    }
    
    // Ofrecer reintento después de un momento
    setTimeout(() => {
      if (confirm('Error cargando crucigrama. ¿Quieres reintentar?')) {
        location.reload();
      }
    }, 3000);
  }
  
  // PROCESO PRINCIPAL DE INICIALIZACIÓN
  try {
    console.log('🚀 Iniciando proceso de carga corregido...');
    
    // Paso 1: Cargar configuración (CRÍTICO - igual que función manual)
    console.log('📋 Paso 1: Cargando configuración...');
    await cargarConfiguracion();
    
    // Paso 2: Esperar CrosswordEngine (CRÍTICO)
    console.log('🎮 Paso 2: Esperando CrosswordEngine...');
    await esperarCrosswordEngine();
    
    // Paso 3: Configurar Firebase (OPCIONAL)
    console.log('🔥 Paso 3: Configurando Firebase...');
    await configurarFirebase();
    
    // Paso 4: Inicializar crucigrama (igual que función manual)
    console.log('🚀 Paso 4: Inicializando crucigrama...');
    const exito = await inicializarCrucigrama();
    
    if (exito) {
      console.log('🎉 ¡Crucigrama cargado exitosamente con inicialización corregida!');
      
      // Ejecutar diagnóstico después de un momento
      setTimeout(() => {
        if (typeof window.checkCrosswordFirebaseIntegration === 'function') {
          console.log('🔍 Ejecutando diagnóstico Firebase...');
          window.checkCrosswordFirebaseIntegration();
        }
      }, 2000);
    }
    
  } catch (error) {
    console.error('❌ Error fatal en inicialización corregida:', error);
    mostrarError(error.message);
  }
  
})();

// ========================================
// 🛠️ FUNCIONES DE UTILIDAD MEJORADAS
// ========================================

// Función de reintento (basada en la función manual que funciona)
window.reintentarCrucigrama = async function() {
  console.log('🔄 Reintentando carga del crucigrama...');
  
  const tema = new URLSearchParams(location.search).get('tema') || 'etica_aristoteles';
  
  try {
    // Limpiar configuración anterior
    if (window.CROSSWORD_CONFIG) {
      delete window.CROSSWORD_CONFIG;
    }
    
    // Cargar configuración con cache-busting
    if (!window.CROSSWORD_CONFIG) {
      const script = document.createElement('script');
      script.src = `themes/${tema}/crossword_config.js?t=${Date.now()}`;
      document.head.appendChild(script);
      
      await new Promise((resolve, reject) => {
        script.onload = () => {
          if (window.CROSSWORD_CONFIG) {
            resolve(true);
          } else {
            reject(new Error('Configuración no cargada'));
          }
        };
        script.onerror = reject;
        setTimeout(() => reject(new Error('Timeout')), 5000);
      });
    }
    
    // Reiniciar motor (exactamente como en función manual)
    if (window.CrosswordEngine && window.CROSSWORD_CONFIG) {
      window.CrosswordEngine.start(window.CROSSWORD_CONFIG, {
        tema: tema,
        useModernUI: true,
        withFirebase: true
      });
      console.log('✅ Crucigrama reiniciado exitosamente');
    } else {
      throw new Error('Dependencias no disponibles para reinicio');
    }
    
  } catch (error) {
    console.error('❌ Error en reintento:', error);
    alert(`No se pudo reiniciar el crucigrama: ${error.message}`);
  }
};

// Función de diagnóstico específico
window.diagnosticoCrucigramaCorregido = function() {

  const tema = new URLSearchParams(location.search).get('tema');
  
  const checks = {
    'URL tema': tema || 'NO DETECTADO',
    'CROSSWORD_CONFIG': typeof window.CROSSWORD_CONFIG !== 'undefined' ? '✅ Disponible' : '❌ No disponible',

    'CrosswordEngine': typeof window.CrosswordEngine === 'object' ? '✅ Disponible' : '❌ No disponible',
    'CrosswordEngine.start': typeof window.CrosswordEngine?.start === 'function' ? '✅ Función disponible' : '❌ Función no disponible',
    'saveCrosswordProgress': typeof window.saveCrosswordProgress === 'function' ? '✅ Disponible' : '❌ No disponible',
    'enhanceCrosswordEngine': typeof window.enhanceCrosswordEngine === 'function' ? '✅ Disponible' : '❌ No disponible',
    'Element #grid': document.getElementById('grid') ? '✅ Encontrado' : '❌ No encontrado',
    'Firebase status': document.getElementById('firebase-status')?.textContent || 'N/A'
  };
  
  Object.entries(checks).forEach(([key, value]) => {

      console.log('  🎮 Estado del motor: Error obteniendo estado');

  }
  
  console.log('\n💡 Comandos disponibles:');
  console.log('  - reintentarCrucigrama() - Reintentar carga');
  console.log('  - diagnosticoCrucigramaCorregido() - Este diagnóstico');
  
  if (!window.CROSSWORD_CONFIG || typeof window.CrosswordEngine !== 'object') {
    console.log('\n🔧 Sugerencia: Ejecutar reintentarCrucigrama()');
  }
};

<script>

// Conectar modal educativo con motor del crucigrama
window.addEventListener('startCrosswordFromModal', function(event) {
  // El modal ya cerró, ahora iniciar el crucigrama normal
  if (window.CrosswordEngine && window.CROSSWORD_CONFIG) {
    const tema = new URLSearchParams(location.search).get('tema') || 'default';
    
    window.CrosswordEngine.start(window.CROSSWORD_CONFIG, {
      tema: tema,
      useModernUI: true,
      withFirebase: true
    });
  }
});

// Script de navegación de vuelta
(function() {
  console.log('🔙 Configurando navegación de vuelta a tema...');
  
  window.regresarATema = function() {
    const tema = new URLSearchParams(window.location.search).get('tema') || 'etica_aristoteles';
    const backUrl = `tema.html?tema=${tema}&theme=${tema}`;
    
    // Guardar progreso antes de salir
    if (typeof window.forceCrosswordSave === 'function') {
      try {
        window.forceCrosswordSave();
      } catch (e) {}
    }
    
    window.location.href = backUrl;
  };
  
  // Configurar botones de vuelta
  function setupBackButtons() {
    const backSelectors = ['#backBtn', '#backToThemeBtn', '.btn-back'];
    
    backSelectors.forEach(selector => {
      const buttons = document.querySelectorAll(selector);
      buttons.forEach(button => {
        if (button.tagName === 'A') {
          button.href = '#';
        }
        button.addEventListener('click', function(e) {
          e.preventDefault();
          regresarATema();
        });
      });
    });
  }
  
  // Inicializar
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupBackButtons);
  } else {
    setTimeout(setupBackButtons, 100);
  }
})();
</script>
