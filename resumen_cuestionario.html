<!DOCTYPE html>
<!--
  resumen_cuestionario.html
  Resumen del cuestionario de un tema, para la carpeta: cada pregunta con su
  respuesta correcta y la explicación. Se puede imprimir / guardar en PDF o
  copiar como texto.

  - Se arma con themes/<tema>/quiz.js (variable <TEMA>_THEME).
  - Para no regalar las respuestas antes de rendir: hasta aprobar el cuestionario
    (≥ 80%) se ven solo las preguntas; al aprobarlo se ven respuestas y explicaciones.
    El admin en vista Docente ve todo.
  - Récord del cuestionario: progreso_temas/<uid>_<tema>_quiz (bestScore).

  Uso: resumen_cuestionario.html?tema=<id>
  Versión: v1.0.0 (2026-10-27)
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen del cuestionario</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <style>
    :root { --bg:#0b1220; --card:#111827; --line:#273250; --text:#e5e7eb; --muted:#9ca3af; --ok:#10b981; --gold:#ffd700; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
    .wrap { max-width:820px; margin:0 auto; padding:16px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    h1 { margin:0; font-size:1.35rem; }
    .autor { color:var(--muted); font-size:.95rem; }
    .acciones { display:flex; gap:8px; flex-wrap:wrap; }
    button, .btn { appearance:none; background-color:rgba(128,90,213,.14); border:1px solid rgba(167,139,250,.55); color:#ddd6fe; padding:.45rem .85rem; border-radius:6px; cursor:pointer; font-weight:600; font-size:.9rem; text-decoration:none; transition:background-color .3s ease; }
    button:hover, .btn:hover { background-color:rgba(128,90,213,.32); }
    .btn-primary { background-color:#805ad5; border-color:#805ad5; color:#fff; }
    .btn-primary:hover { background-color:#a78bfa; }
    .avance { padding:12px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); margin-bottom:14px; font-weight:600; }
    .avance.aprobado { border-color:rgba(255,215,0,.6); box-shadow:0 0 16px rgba(255,215,0,.2); }
    section.pregunta { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
    .enunciado { margin:0; font-weight:700; }
    .num { color:var(--muted); font-weight:500; margin-right:4px; }
    .respuesta { margin:8px 0 0; padding:8px 12px; border-left:3px solid var(--ok); background:rgba(16,185,129,.08); border-radius:6px; }
    .explicacion { margin:6px 0 0; color:var(--muted); font-size:.95rem; }
    .tapado { margin:8px 0 0; color:var(--muted); font-style:italic; }
    .aviso { color:var(--muted); text-align:center; padding:30px 10px; }
    .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ok); color:#fff; padding:10px 14px; border-radius:10px; font-weight:600; display:none; }

    /* Versión para imprimir / guardar PDF: fondo blanco, sin botones ni partes tapadas */
    @media print {
      body { background:#fff; color:#000; }
      .wrap { max-width:none; padding:0; }
      .acciones, .toast, .tapado { display:none !important; }
      .avance, section.pregunta { background:#fff; border:1px solid #999; color:#000; box-shadow:none; break-inside:avoid; }
      .respuesta { background:#fff; border-left-color:#000; }
      .explicacion { color:#333; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Resumen del cuestionario</h1>
        <div class="autor" id="autor"></div>
      </div>
      <div class="acciones">
        <button id="btnImprimir" title="Imprimir o guardar como PDF">Imprimir / PDF</button>
        <button id="btnCopiar" title="Copiar el resumen como texto">Copiar texto</button>
        <a class="btn" id="btnQuiz">Ir al cuestionario</a>
        <a class="btn btn-primary" id="btnHub">Volver al tema</a>
      </div>
    </header>

    <div class="avance" id="avance">Cargando…</div>
    <div id="contenido"><p class="aviso">Cargando resumen…</p></div>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, db, doc, getDoc, onAuthStateChanged, isCurrentUserAdmin } from "/prueba_filo/firebase.js";

    const UMBRAL_APROBADO = 80;
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const tema = (params.get('tema') || params.get('theme') || sessionStorage.getItem('tema.active') || '').trim();
    const escapeHtml = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function urlCon(pagina) {
      const u = new URL(pagina, location);
      u.searchParams.set('tema', tema);
      u.searchParams.set('theme', tema);
      return u.toString();
    }

    // Carga themes/<tema>/quiz.js (mismo archivo que usa el cuestionario)
    async function cargarCuestionario() {
      if (!/^[a-z0-9_]+$/.test(tema)) throw new Error('Tema inválido');
      let archivo = 'quiz.js';
      try {
        const cfg = await (await fetch(`themes/${tema}/config.json`, { cache: 'no-store' })).json();
        if (typeof cfg?.files?.quiz === 'string') archivo = cfg.files.quiz;
      } catch {}
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = `themes/${tema}/${archivo}`;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Este tema todavía no tiene cuestionario'));
        document.head.appendChild(s);
      });
      const datos = window[`${tema.toUpperCase()}_THEME`] ||
        Object.keys(window).filter(k => k.endsWith('_THEME')).map(k => window[k]).find(t => Array.isArray(t?.questions));
      if (!datos || !Array.isArray(datos.questions) || !datos.questions.length) throw new Error('Este tema todavía no tiene cuestionario');
      return datos;
    }

    function esperarUsuario() {
      return new Promise((resolve) => {
        const stop = onAuthStateChanged(auth, (user) => { stop(); resolve(user); });
        setTimeout(() => resolve(auth.currentUser), 5000);
      });
    }

    // Mejor puntaje del cuestionario: sesión actual o récord en Firebase
    async function mejorPuntaje(user) {
      let pct = 0;
      try {
        const local = JSON.parse(sessionStorage.getItem(`tema.${tema}.quiz`) || '{}');
        if (local.total > 0) pct = Math.round(((local.score || 0) / local.total) * 100);
      } catch {}
      if (user) {
        try {
          const snap = await getDoc(doc(db, 'progreso_temas', `${user.uid}_${tema}_quiz`));
          if (snap.exists()) { const d = snap.data(); pct = Math.max(pct, Number(d.bestScore ?? d.score ?? 0) || 0); }
        } catch (e) {
          console.warn('No se pudo leer el progreso de Firebase:', e);
        }
      }
      return pct;
    }

    function render(datos, verRespuestas, pct) {
      const texto = [`RESUMEN DEL CUESTIONARIO — ${datos.title || tema}`, ''];
      $('contenido').innerHTML = datos.questions.map((q, i) => {
        const correcta = (q.answers || []).find(a => a.correct);
        // En la carpeta no hace falta el "¡Correcto!" del juego
        if (correcta?.explanation) correcta.explanation = correcta.explanation.replace(/^\s*¡?(correcto|exacto|perfecto|muy bien)[!.]*\s*/i, '');
        texto.push(`${i + 1}. ${q.question}`);
        let cuerpo;
        if (verRespuestas && correcta) {
          texto.push(`   R: ${correcta.text}`);
          if (correcta.explanation) texto.push(`   Por qué: ${correcta.explanation}`);
          cuerpo = `<p class="respuesta">${escapeHtml(correcta.text)}</p>` +
            (correcta.explanation ? `<p class="explicacion">${escapeHtml(correcta.explanation)}</p>` : '');
        } else {
          cuerpo = `<p class="tapado">🔒 Aprobá el cuestionario (80%) para ver la respuesta.</p>`;
        }
        texto.push('');
        return `<section class="pregunta"><p class="enunciado"><span class="num">${i + 1}.</span>${escapeHtml(q.question)}</p>${cuerpo}</section>`;
      }).join('');

      const total = datos.questions.length;
      $('avance').classList.toggle('aprobado', verRespuestas);
      $('avance').textContent = verRespuestas
        ? `🏆 Cuestionario aprobado${pct ? ` (${pct}%)` : ''}: ${total} preguntas con sus respuestas, listas para tu carpeta.`
        : `📝 Tu mejor resultado: ${pct}%. Acá tenés las ${total} preguntas para estudiar; las respuestas se desbloquean al aprobar el cuestionario (80%).`;
      return texto.join('\n');
    }

    function aviso(msg) {
      const t = $('toast'); t.textContent = msg; t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    async function iniciar() {
      $('btnHub').href = urlCon('tema.html');
      $('btnQuiz').href = urlCon('quiz.html');
      $('btnImprimir').addEventListener('click', () => window.print());

      let datos;
      try {
        datos = await cargarCuestionario();
      } catch (e) {
        $('avance').textContent = '⚠️ ' + e.message;
        $('contenido').innerHTML = '';
        return;
      }
      $('autor').textContent = datos.title || '';
      document.title = `Resumen · ${datos.title || tema}`;

      const user = await esperarUsuario();
      const docente = user ? (await isCurrentUserAdmin() && localStorage.getItem('admin.vistaAlumno') !== '1') : false;
      const pct = await mejorPuntaje(user);
      const texto = render(datos, docente || pct >= UMBRAL_APROBADO, pct);

      $('btnCopiar').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(texto);
          aviso('Resumen copiado');
        } catch {
          aviso('No se pudo copiar: usá Imprimir / PDF');
        }
      });
    }

    iniciar();
  </script>
</body>
</html>
