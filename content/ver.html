<!-- Ejemplo de tarjeta interactiva para un nodo -->
<div class="nodo" onclick="expandirNodo(this)">
  <h3>😨 Angustia</h3>
  <p class="desc">Lucidez/vértigo ante la responsabilidad por nuestras decisiones.</p>
  <div class="actividad" style="display: none;">
    <p>¿Cuál de estas NO es angustia existencial?</p>
    <button onclick="responder('A')">A) Elegir carrera</button>
    <button onclick="responder('B')">B) Seguir dieta médica</button>
    <button onclick="responder('C')">C) Terminar una relación</button>
    <textarea placeholder="Explica tu elección..."></textarea>
    <button onclick="guardarRespuesta()">Enviar</button>
  </div>
  <div class="feedback" style="display: none;">
    <p id="resultado"></p>
    <button onclick="siguienteNodo()">Continuar</button>
  </div>
</div>

<script>
  function expandirNodo(element) {
    element.querySelector('.actividad').style.display = 'block';
  }

  function responder(opcion) {
    const resultado = document.getElementById('resultado');
    if (opcion === 'B') {
      resultado.innerHTML = "✅ ¡Correcto! La angustia surge de elegir sin excusas.";
      element.querySelector('.feedback').style.display = 'block';
      guardarProgreso(element); // Guarda en localStorage
    } else {
      resultado.innerHTML = "❌ Intenta de nuevo. La angustia implica <strong>elección libre</strong>.";
    }
  }

  function guardarProgreso(element) {
    const nodo = element.querySelector('h3').textContent;
    localStorage.setItem(nodo, 'completado');
    actualizarBarraProgreso();
  }
</script>
